# Tells Netlify how to build the site when connected to GitHub.
# On every push to the repo, Netlify runs this and publishes the result.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: always serve index.html (the app handles its own screens).
# Real files (sw.js, manifest, icons) are served directly — this only catches
# unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached long, or phones get stuck on an old
# version after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Serve the web manifest with the correct content type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Security headers on every response. The script/style policy stays a little
# loose (allows inline) because the Members-directory and receipt "print"
# buttons open a popup window and write their own <script>/<style> straight
# into it (FinTrack.jsx) rather than loading them from a file — a stricter
# policy would silently stop those from auto-printing.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self' https://vveydcmdsmucaoqitnch.supabase.co wss://vveydcmdsmucaoqitnch.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
